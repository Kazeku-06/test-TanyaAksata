version: '3.8'

services:
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: tanyaaksata_backend
    restart: unless-stopped
    ports:
      - "2009:2009"
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      DB_DATABASE: test_tanyaaksata
      DB_USERNAME: mel
      DB_PASSWORD: root
      APP_URL: https://api-ta.neverland.my.id
      VITE_APP_NAME: Tanya-Aksata
    volumes:
      - ./be:/app
      - /app/vendor
      - /app/node_modules

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: tanyaaksata_frontend
    restart: unless-stopped
    ports:
      - "1608:1608"
    environment:
      NEXT_PUBLIC_API_URL: https://api-ta.neverland.my.id/api/v1
      NEXT_PUBLIC_STORAGE_URL: https://api-ta.neverland.my.id/storage
    volumes:
      - ./fe:/app
      - /app/node_modules
      - /app/.next